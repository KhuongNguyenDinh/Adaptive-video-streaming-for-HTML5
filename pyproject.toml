[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abr"
version = "2.0.0"
description = "AdaptiveStream Studio: HTML5 MPEG-DASH Player, ABR Algorithms, and QoE Continuous Improvement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "Jinja2>=3.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
abr = "abr.cli:main"

[tool.setuptools.packages.find]
include = ["abr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
